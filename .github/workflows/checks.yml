name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test local storage
        working-directory: ios/ReaderCore
        run: swift test
      - name: Compile iPhone app
        run: xcodebuild -quiet -project ios/OfflineReader.xcodeproj -scheme OfflineReader -destination 'generic/platform=iOS' -derivedDataPath work/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Compile simulator app
        run: xcodebuild -quiet -project ios/OfflineReader.xcodeproj -scheme OfflineReader -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath work/SimulatorDerivedData ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO build
      - name: Test cached article presentation
        run: |
          reader_test_device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')
          xcodebuild -quiet -project ios/OfflineReader.xcodeproj -scheme OfflineReader -destination "platform=iOS Simulator,id=$reader_test_device" -derivedDataPath work/TestDerivedData -resultBundlePath work/ReaderUIResults.xcresult -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-presentation-tests
          path: work/ReaderUIResults.xcresult
          retention-days: 7
      - name: Compile isolated UI preview
        if: github.event_name == 'pull_request'
        run: |
          xcodebuild -quiet -project ios/OfflineReader.xcodeproj -scheme OfflineReader -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath work/SimulatorDerivedData ARCHS="$(uname -m)" PRODUCT_BUNDLE_IDENTIFIER=com.akhilvuputuri.offlinereader.preview CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent work/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/OfflineReader.app work/LibraryPreview.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: library-ui-preview
          path: work/LibraryPreview.zip
          retention-days: 7
