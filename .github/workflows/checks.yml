name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test local storage
        working-directory: ios/ReaderCore
        run: swift test
      - name: Compile iPhone app
        run: xcodebuild -quiet -project ios/OfflineReader.xcodeproj -scheme OfflineReader -destination 'generic/platform=iOS' -derivedDataPath work/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Compile simulator app
        run: xcodebuild -quiet -project ios/OfflineReader.xcodeproj -scheme OfflineReader -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath work/SimulatorDerivedData ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO build
